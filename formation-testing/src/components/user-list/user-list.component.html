<div *ngIf="error" class="error">
  {{ error }}
</div>

<ul>
  <li *ngFor="let user of users">
    <span class="user-name">{{ user.name }}</span>
    <span class="user-email">{{ user.email }}</span>

    <button type="button" (click)="deleteUser(user.id)">
      Supprimer
    </button>
  </li>
</ul>
